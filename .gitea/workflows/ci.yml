name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push
    runs-on: build-htz-01
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and push Docker image
        run: |
          docker build -t cr.jdbnet.co.uk/jdbnet/gostream:latest .
          docker push cr.jdbnet.co.uk/jdbnet/gostream:latest

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: k3s-lan-01
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply manifests
        run: |
          sudo kubectl replace -f deployment.yaml --grace-period=60 --force

  sonarqube:
    name: SonarQube
    runs-on: build-htz-01
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Valid Project Key
        id: sonar_setup
        run: |
          CLEAN_KEY=$(echo "${{ gitea.repository }}" | tr '/' ':')
          echo "key=$CLEAN_KEY" >> $GITHUB_OUTPUT

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ steps.sonar_setup.outputs.key }}
            -Dsonar.projectName=${{ gitea.repository }}
            -Dsonar.qualitygate.wait=true